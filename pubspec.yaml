name: wala_pos
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  # https://pub.dev/packages/flutter_riverpod
  flutter_riverpod: ^2.6.1
  # https://pub.dev/packages/riverpod_annotation
  riverpod_annotation: ^2.6.1
  # https://pub.dev/packages/go_router
  go_router: ^14.3.0
  # https://pub.dev/packages/retrofit
  retrofit: ^4.4.1
  # https://pub.dev/packages/dio
  dio: ^5.7.0
  # https://pub.dev/packages/dio_http_formatter
  dio_http_formatter: ^3.2.1
  # https://pub.dev/packages/freezed_annotation
  freezed_annotation: ^2.4.4
  # https://pub.dev/packages/json_annotation
  json_annotation: ^4.9.0
  # https://pub.dev/packages/intl
  intl: ^0.20.2
  # https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.0.11
  # https://pub.dev/packages/multiple_result
  multiple_result: ^5.1.0
  multi_masked_formatter: ^1.0.0 
  flutter_nfc_kit: ^3.3.0
  toastification: ^3.0.3
  firebase_core: ^4.0.0
  flutter_keyboard_visibility: ^6.0.0
  shared_preferences: ^2.5.3
  modal_progress_hud_nsn: ^0.5.1
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  mobile_scanner: ^6.0.0 #
  flutter_pos_printer_platform_image_3: ^1.2.4
  esc_pos_utils_plus: ^2.0.4

  flutter_localizations:
    sdk: flutter

 
dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.2
  flutter_gen_runner: ^5.8.0



# analysis_options.yaml
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

flutter:
  uses-material-design: true
  assets:
  - assets/images/

  fonts:
  - family: Alexandria
    fonts:
      - asset: assets/fonts/Alexandria-Regular.ttf
      - asset: assets/fonts/Alexandria-Bold.ttf
        weight: 700


